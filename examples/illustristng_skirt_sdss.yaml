root_path: output/IllustrisTNG_SKIRT_SDSS
overwrite: false
verbose: true

html:
  title: HiPSter representation of IllustrisTNG SKIRT SDSS
  aladin_lite_version: 3.6.5

tasks:
  - class_path: hipster.HiPSGenerator
    init_args:
      decoder:
        model_path: hf://HITS-AIN/IllustrisTNG_SKIRT_SDSS/vae/resnet18/Perceptual/S2/decoder.onnx
        input_name: z
      image_maker:
        class_path: hipster.ImagePlotter
      max_order: 3
      hierarchy: 4
      hips_id: IllustrisTNG SKIRT SDSS
      hips_name: IllustrisTNG SKIRT SDSS model
      hips_path: model

  - class_path: hipster.DatasetProjection
    init_args:
      encoder:
        model_path: hf://HITS-AIN/IllustrisTNG_SKIRT_SDSS/vae/resnet18/Perceptual/S2/encoder.onnx
      data_directory: hf://datasets/HITS-AIN/IllustrisTNG_SKIRT_SDSS
      image_maker:
        class_path: hipster.ImagePlotter
      max_order: 3
      hierarchy: 4
      hips_id: IllustrisTNG SKIRT SDSS
      hips_name: IllustrisTNG SKIRT SDSS projection dewarped
      hips_path: projection_dewarped
      distortion_correction: true

  - class_path: hipster.VOTableGenerator
    init_args:
      encoder:
        model_path: hf://HITS-AIN/IllustrisTNG_SKIRT_SDSS/vae/resnet18/Perceptual/S2/encoder.onnx
      data_directory: hf://datasets/HITS-AIN/IllustrisTNG_SKIRT_SDSS
      color: red
      shape: circle
      size: 5
      extra_columns: [sersic_n_i, sersic_n_g]
      color_map:
        column: sersic_n_i
        vmin: 0.2
        vmax: 10
        log: true

  - class_path: hipster.HiPSCatalogGenerator
    init_args:
      encoder:
        model_path: hf://HITS-AIN/IllustrisTNG_SKIRT_SDSS/vae/resnet18/Perceptual/S2/encoder.onnx
      data_directory: hf://datasets/HITS-AIN/IllustrisTNG_SKIRT_SDSS
      catalog_name: IllustrisTNG SKIRT SDSS HiPS catalog
      hips_path: catalog
      level_limit: 4
      color: orange
      shape: circle
      size: 5
      extra_columns: [sersic_n_i, sersic_n_g]
      color_map:
        column: sersic_n_i
        # vmin: 1.0
        # vmax: 4.0
        vmin_percentile: 5
        vmax_percentile: 95
        log: false
        cmap: coolwarm
      cluster:
        mode: local
        n_workers: 4
        memory_per_worker: 4GB
