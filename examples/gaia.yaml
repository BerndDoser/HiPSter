root_path: HiPSter
html:
  url: http://localhost:8083
  title: HiPSter representation of Gaia XP DR3
  aladin_lite_version: latest
tasks:
  - class_path: hipster.HiPSGenerator
    init_args:
      decoder:
        model_path: decoder.onnx
      image_maker:
        class_path: hipster.SpectrumPlotter
        init_args:
          wavelengths:
            start: 336
            stop: 1021
            step: 2
          ylim: [0, 1]
          margin: 0.02
          figsize_in_pixel: 128
          flip: True
      hips_id: Gaia1
      hips_name: Gaia XP DR3 model spectrum
      hips_path: gaia/model_spectrum
      max_order: 2
      hierarchy: 2
  - class_path: hipster.HiPSGenerator
    init_args:
      decoder:
        model_path: decoder.onnx
      image_maker:
        class_path: hipster.AbsorptionLinePlotter
        init_args:
          wavelengths:
            start: 336
            stop: 1021
            step: 2
          margin: 0.02
          figsize_in_pixel: 128
          flip: True
      hips_id: Gaia2
      hips_name: Gaia XP DR3 model absorption line
      hips_path: gaia/model_absorption_line
      max_order: 2
      hierarchy: 2
  - class_path: hipster.VOTableGenerator
    init_args:
      encoder:
        model_path: encoder.onnx
      data_directory: data/gaia/xp_calibrated
      color: red
      shape: circle
      size: 10
  - class_path: hipster.HiPSCatalogGenerator
    init_args:
      encoder:
        model_path: encoder.onnx
      data_directory: data/gaia/xp_calibrated
      catalog_name: Gaia XP DR3 HiPS catalog
      hips_path: gaia/catalog
      color: orange
      shape: circle
      size: 10
      # Encode in parallel, e.g. as Slurm array job with `stage: encode`, `num_shards: N` and
      # `shard_index: $SLURM_ARRAY_TASK_ID`, then run a single job with `stage: build`.
      cluster:
        mode: local
        n_workers: 8
        memory_per_worker: 8GB
      # cluster:
      #   mode: slurm
      #   n_workers: 20
      #   threads_per_worker: 8
      #   memory_per_worker: 32GB
      #   slurm:
      #     queue: cpu
      #     account: my-account
